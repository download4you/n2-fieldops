name: Release n2-fieldops

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build deterministic release artifacts
        run: python scripts/build_release.py --output-dir dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS \
            --title "n2-fieldops ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/RELEASE_NOTES_$(tr -d '\r\n' < VERSION).md" \
            --verify-tag

name: Validate FieldOps

on:
  push:
  pull_request:

jobs:
  repository:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Validate release layout
        run: python scripts/build_release.py --check

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate UTF-8 with Windows PowerShell 5.1
        shell: powershell
        run: .\fieldops-powershell-utf8\scripts\test-utf8-roundtrip.ps1 | Format-List *

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate UTF-8 with PowerShell 7
        shell: pwsh
        run: .\fieldops-powershell-utf8\scripts\test-utf8-roundtrip.ps1 | Format-List *
